name: test-publish

on:
  push:
    branches: [main, master]
  pull_request:
    branches: ["..*"]

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        # mcp-policy-proxy depends on mcp2cli and skills-server via git URLs.
        # pip resolves them automatically during install.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: python3 -m pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && startsWith(github.ref_name, 'v')
    permissions:
      id-token: write  # for trusted publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
      - name: Show built artifacts
        run: ls -la dist/
