[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "mcp-gateway"
version = "0.1.0"
description = "MCP policy proxy with enforcement + compound endpoints"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
repository = "https://github.com/prog76/mcp_gateway"
dependencies = [
    "mcp2cli @ git+https://github.com/prog76/mcp_mcp2cli.git",
    "skills-server @ git+https://github.com/prog76/mcp_skills-server.git",
    "mcp>=1.0.0",
    "fastmcp>=2.0.0",
    "jsonschema>=4.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
mcp-gateway-start = "gateway.start:main"

[project.urls]
Homepage = "https://github.com/prog76/mcp_gateway"
Documentation = "https://github.com/prog76/mcp_gateway#readme"
"mcp2cli upstream" = "https://github.com/prog76/mcp_mcp2cli"
"skills-server upstream" = "https://github.com/prog76/mcp_skills-server"

# Allow direct (git/URL) references in project.dependencies, e.g.
#   mcp2cli @ git+https://github.com/prog76/mcp_mcp2cli.git
#   skills-server @ git+https://github.com/prog76/mcp_skills-server.git
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
