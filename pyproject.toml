[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "gateway"
version = "0.1.0"
description = "MCP policy proxy with enforcement + compound endpoints"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
repository = "https://github.com/prog76/mcp_gateway"
dependencies = [
    "mcp2cli @ git+https://github.com/prog76/mcp_mcp2cli.git@v0.1.8",
    "mcp>=1.28.1,<2",
    "fastmcp>=3.4.2,<4",
    "jsonschema>=4.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "mypy>=1.10.0", "types-PyYAML>=6.0"]

[project.scripts]
mcp-gateway-start = "gateway.start:main"

[project.urls]
Homepage = "https://github.com/prog76/mcp_gateway"
Documentation = "https://github.com/prog76/mcp_gateway#readme"
"mcp2cli upstream" = "https://github.com/prog76/mcp_mcp2cli"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

# Third-party libs without type stubs
[[tool.mypy.overrides]]
module = ["mcp.*", "fastmcp.*", "starlette.*", "uvicorn.*", "httpx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
